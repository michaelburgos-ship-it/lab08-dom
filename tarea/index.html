<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Monedas Interactivo</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 450px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        
        .campo {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        
        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        ul {
            list-style: none;
            padding: 0;
        }
        
        li {
            background: #fff;
            margin: 8px 0;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .btn-enviar {
            background: #2ecc71;
            color: white;
            font-size: 16px;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Conversor de Monedas</h2>

    <div id="mensajeError" class="error"></div>

    <form id="formConversor">
        <div class="campo">
            <label>Monto en Soles (S/):</label>
            <input type="number" id="montoInput" min="0" step="0.01" placeholder="Ejemplo: 100">
        </div>
        <div class="campo">
            <label>Moneda de destino:</label>
            <select id="monedaSelect">
                <option value="USD">Dólar Americano (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="ARS">Peso Argentino (ARS)</option>
            </select>
        </div>
        <button type="submit" class="btn-enviar">Calcular Conversión</button>
    </form>

    <h3>Historial de Consultas</h3>
    <ul id="listaHistorial"></ul>

    <script src="app.js"></script>
</body>

</html>
